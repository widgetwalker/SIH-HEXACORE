<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B18" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4AA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#00D4AA" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Base Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6" />

  <!-- Outer Tactical Hexagonal Shield Boundary -->
  <path
    d="M 256 52 
       L 436 128 
       L 436 292 
       C 436 382 358 438 256 468 
       C 154 438 76 382 76 292 
       L 76 128 
       Z"
    fill="#0A1128"
    stroke="url(#borderGrad)"
    stroke-width="18"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Shield Inset -->
  <path
    d="M 256 82 
       L 406 146 
       L 406 284 
       C 406 360 338 410 256 438 
       C 174 410 106 360 106 284 
       L 106 146 
       Z"
    fill="none"
    stroke="#00D4AA"
    stroke-width="4"
    stroke-opacity="0.35"
    stroke-dasharray="16 10"
  />

  <!-- Center HexaCore Disaster Relief Cross / Star Beacon -->
  <g filter="url(#glow)">
    <!-- Vertical Crossbar -->
    <rect x="232" y="160" width="48" height="176" rx="20" fill="url(#coreGrad)" />
    <!-- Horizontal Crossbar -->
    <rect x="168" y="224" width="176" height="48" rx="20" fill="url(#coreGrad)" />

    <!-- Center Luminous Core Ring -->
    <circle cx="256" cy="248" r="32" fill="#FFFFFF" />
    <circle cx="256" cy="248" r="18" fill="#00D4AA" />
    <circle cx="256" cy="248" r="8" fill="#FFFFFF" />
  </g>

  <!-- Emergency Radar Scan Arc (Bottom Safety Baseline) -->
  <path
    d="M 196 356 C 216 372 236 380 256 382 C 276 380 296 372 316 356"
    stroke="#38BDF8"
    stroke-width="8"
    stroke-linecap="round"
    stroke-opacity="0.85"
  />
  <circle cx="256" cy="382" r="5" fill="#38BDF8" />
</svg>
