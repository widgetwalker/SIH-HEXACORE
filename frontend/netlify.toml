# Netlify Configuration for SafeZone (when base directory is set to frontend/)

[build]
  command = "npm run build && rm -rf .next/cache"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev --legacy-peer-deps"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_BACKEND_URL,NEXT_PUBLIC_CAMPUS_ID,NEXT_PUBLIC_WS_TOKEN,NEXT_PUBLIC_WS_URL,GEMINI_API_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,.next/**,src/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
