# Local development environment. Run from the REPO ROOT with:
#   docker compose up
#
# This brings up three services so every teammate has the exact same
# setup instead of installing Postgres/Redis by hand:
#   1. The FastAPI backend (backend/)
#   2. PostgreSQL 16 with PostGIS - auto-loads database/schema.sql
#      the FIRST time the container starts (empty data volume only)
#   3. Redis (used from Day 2 onward for caching and pub/sub)
#
# NOTE: schema.sql only runs once, when the postgres_data volume is
# first created. If you change schema.sql later and want it re-applied,
# run: docker compose down -v   (this wipes local dev data - fine for
# a hackathon, never do this against a real deployed database)

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sih_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app  # live-mounts code, no rebuild needed on edits

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

